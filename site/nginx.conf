# Landing site — /etc/nginx/sites-available/biblia-narrada on nlabs.live.
# Files come from `python3 site/build.py --deploy`. HTTPS (443) is added to this
# block by `certbot --nginx -d biblia.nlabs.live -d bible.nlabs.live --redirect`.
server {
    listen 80;
    listen [::]:80;
    server_name biblia.nlabs.live bible.nlabs.live;

    root /home/nlabs/sites/biblia-narrada;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 7d;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
