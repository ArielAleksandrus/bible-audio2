workflows:
  android-release:
    name: Android release (Play Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24
      java: 21
      android_signing:
        # Reference name of the keystore uploaded in
        # Team settings → Code signing identities → Android keystores.
        - upload
      groups:
        # Holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (service account JSON).
        - google_play
      vars:
        PACKAGE_NAME: live.nlabs.biblia
    # On its own only for a major version (the one that needs a new store
    # build): the tag vX.0.0 on that version's commit. Minor and patch versions
    # reach the installed apps over the air (OtaService) and build nothing; a
    # native build outside a major is started from the "Start new build" button.
    # The signed AAB goes to the Play production track as a draft; rolling that
    # draft out to users stays a step in Play Console while submit_as_draft is
    # true. Vercel deploys the web app, and the over-the-air bundle with it, on
    # every push to master.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.0.0'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build signed AAB
        script: |
          # versionCode must grow on every upload: take the highest one on any
          # Play track and add 1. Before the first upload there is none, so
          # fall back to Codemagic's build number.
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            export VERSION_CODE=$BUILD_NUMBER
          else
            export VERSION_CODE=$((LATEST + 1))
          fi
          export VERSION_NAME=$(node -p "require('./package.json').version")
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # Business account: no closed-testing requirement, so go straight to
        # production. The release lands as a draft; roll it out in Play Console.
        track: production
        # Required while the app has never been published on Play
        # ("Only releases with status draft may be created on draft app").
        # Switch to false after the first release goes out.
        submit_as_draft: true

  # The App Store .ipa, uploaded to App Store Connect, where it shows up in
  # TestFlight. Started from the "Start new build" button only (same as
  # CarteiraPro's ios-loja). Registered in Codemagic, never in this repo:
  # - Team settings > Integrations > Developer Portal: the App Store Connect API
  #   key, named carteira_pro_asc (one key covers every app of the Apple team).
  # - Code signing identities: the Apple Distribution certificate and the App
  #   Store profile for live.nlabs.bible, created AFTER the App ID capabilities
  #   (Sign in with Apple).
  ios-loja:
    name: iOS - App Store (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: carteira_pro_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: live.nlabs.bible
      node: 24
      # Package.swift uses swift-tools-version 6.1 -> Xcode 16.3 or newer.
      xcode: latest
      vars:
        # Apple ID of the app in App Store Connect (App Information > Apple ID).
        APP_STORE_APPLE_ID: "6832831597"
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Web app and Capacitor
        script: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Distribution profile
        script: xcode-project use-profiles
      # Version from package.json; build number = latest in TestFlight for that
      # version + 1 (Apple rejects a repeated one). Without APP_STORE_APPLE_ID,
      # Codemagic's build number.
      - name: Version and build number
        script: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" --pre-release-version "$VERSION" 2>/dev/null || echo 0)
            BUILD=$((LAST + 1))
          else
            BUILD=$BUILD_NUMBER
          fi
          sed -i '' -e "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/" \
                    -e "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD;/" ios/App/App.xcodeproj/project.pbxproj
          echo "iOS $VERSION ($BUILD)"
      - name: IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # The .ipa goes to App Store Connect and, once processed, to internal
    # TestFlight testers. Review and release are always by hand there.
    publishing:
      app_store_connect:
        auth: integration
