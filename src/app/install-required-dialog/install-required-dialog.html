<div class="install-required-dialog">
  <mat-icon class="install-required-icon">install_mobile</mat-icon>

  <mat-dialog-content>
    <p>{{ 'install_required.message' | translate }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-raised-button color="primary" (click)="continue()">
      {{ 'install_required.continue' | translate }}
    </button>
  </mat-dialog-actions>
</div>
