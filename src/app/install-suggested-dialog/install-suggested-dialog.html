<div class="install-suggested-dialog ion-padding">
  <ion-icon class="install-suggested-icon" name="phone-portrait-outline"></ion-icon>

  <p>{{ 'install_suggested.message' | translate }}</p>

  <div class="actions">
    <ion-button fill="clear" (click)="dismiss()">
      {{ 'install_suggested.dismiss' | translate }}
    </ion-button>
    <ion-button (click)="install()">
      {{ 'install_suggested.install' | translate }}
    </ion-button>
  </div>
</div>
