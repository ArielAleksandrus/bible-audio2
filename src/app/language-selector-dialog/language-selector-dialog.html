<div class="ion-padding">
  <h2 class="title">Escolha o idioma da Bíblia</h2>

  <ion-list lines="full" class="language-list">
    @for (option of options; track option.lang) {
      <ion-item button [detail]="false" [disabled]="loading" (click)="select(option.lang, option.version)">
        <span slot="start" class="flag">{{ option.flag }}</span>
        <ion-label>{{ option.label }}</ion-label>
      </ion-item>
    }
  </ion-list>

  @if (loading) {
    <div class="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <span>Carregando Bíblia...</span>
    </div>
  }
</div>
