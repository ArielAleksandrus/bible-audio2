<ion-app>
  @if (!native) {
    <app-in-app-browser-overlay></app-in-app-browser-overlay>
  }

  <!-- Install/notification prompts use translate pipes, and no i18n file is
       loaded until a language is picked. They also shouldn't appear while
       the home page is still fetching the Bible JSON, so they wait for the
       picker to actually be on screen, not just for translations. -->
  @if (appState.canShowInstallPrompt$ | async) {
    @if (!native) {
      <app-install-prompt></app-install-prompt>
    }
    <app-notification-prompt></app-notification-prompt>
  }

  <ion-router-outlet></ion-router-outlet>
</ion-app>
