@if (currentTrack) {
  <div class="audio-player">
    <div class="header">
      <div class="track-info">
        <div class="title">{{ currentTrack.title }}</div>
        <div class="subtitle">Bíblia Narrada</div>
      </div>
      <ion-button fill="clear" color="medium" size="small" class="close-btn" (click)="close()" aria-label="Fechar player">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </div>

    <div class="controls">
      <ion-button fill="clear" (click)="rewind()" aria-label="-10s">
        <ion-icon slot="icon-only" name="play-back"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="prev()" [disabled]="!audioService.hasPrevious()" aria-label="Anterior">
        <ion-icon slot="icon-only" name="play-skip-back"></ion-icon>
      </ion-button>
      <ion-button shape="round" class="play-btn" (click)="togglePlayPause()" [attr.aria-label]="isPlaying ? 'Pausar' : 'Tocar'">
        <ion-icon slot="icon-only" [name]="isPlaying ? 'pause' : 'play'"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="next()" [disabled]="!audioService.hasNext()" aria-label="Próximo">
        <ion-icon slot="icon-only" name="play-skip-forward"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="forward()" aria-label="+10s">
        <ion-icon slot="icon-only" name="play-forward"></ion-icon>
      </ion-button>
    </div>

    <div class="progress-container">
      <span class="time">{{ formatTime(currentTime) }}</span>
      <ion-range
        class="seek"
        aria-label="Posição"
        [min]="0"
        [max]="duration || 1"
        [value]="dragging ? dragValue : currentTime"
        (ionKnobMoveStart)="dragging = true"
        (ionInput)="dragValue = $any($event.detail.value)"
        (ionKnobMoveEnd)="onSeekEnd($any($event.detail.value))">
      </ion-range>
      <span class="time">{{ formatTime(duration) }}</span>
    </div>
  </div>
}
