<div class="iab-overlay" *ngIf="warning.texts$ | async as texts">
  <div class="iab-arrow-wrap">
    <svg class="iab-arrow" width="60" height="74" viewBox="0 0 60 74" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8 72 C-2 46 4 16 34 6" stroke="#d32f2f" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M20 2 L38 4 L32 21" stroke="#d32f2f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <span class="iab-menu-hint">{{ texts.menu_hint }}</span>
  </div>

  <div class="iab-card">
    <button mat-icon-button class="iab-close" (click)="dismiss()" [attr.aria-label]="texts.dismiss">
      <mat-icon>close</mat-icon>
    </button>

    <mat-icon class="iab-icon">open_in_browser</mat-icon>

    <div class="iab-text">
      <strong>{{ texts.title }}</strong>
      <span>{{ texts.message }}</span>
    </div>
  </div>
</div>
