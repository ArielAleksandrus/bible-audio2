<div class="install-banner" *ngIf="installServ.visible$ | async">
  <ion-icon class="banner-icon" name="phone-portrait-outline"></ion-icon>

  <div class="banner-text">
    <ng-container *ngIf="installServ.mode === 'android'">
      <strong>{{ 'install_prompt.title' | translate }}</strong>
      <span>{{ 'install_prompt.description' | translate }}</span>
    </ng-container>
    <ng-container *ngIf="installServ.mode === 'ios'">
      <strong>{{ 'install_prompt.title' | translate }}</strong>
      <span>{{ 'install_prompt.ios_instructions' | translate }}</span>
    </ng-container>
  </div>

  <div class="banner-actions">
    <ion-button color="light" size="small" *ngIf="installServ.mode === 'android'" (click)="install()">
      {{ 'install_prompt.install_button' | translate }}
    </ion-button>
    <ion-button fill="clear" class="close-button" *ngIf="installServ.mode === 'android'" (click)="dismiss()" aria-label="Dismiss">
      <ion-icon slot="icon-only" name="close"></ion-icon>
    </ion-button>
    <ion-button fill="clear" class="close-button" *ngIf="installServ.mode === 'ios'" (click)="showTutorial()" aria-label="Como fazer?">
      <ion-icon slot="icon-only" name="help-circle-outline"></ion-icon>
    </ion-button>
  </div>
</div>
