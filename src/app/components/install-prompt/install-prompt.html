<div class="install-banner" *ngIf="installServ.visible$ | async">
  <mat-icon class="banner-icon">install_mobile</mat-icon>

  <div class="banner-text">
    <ng-container *ngIf="installServ.mode === 'android'">
      <strong>{{ 'install_prompt.title' | translate }}</strong>
      <span>{{ 'install_prompt.description' | translate }}</span>
    </ng-container>
    <ng-container *ngIf="installServ.mode === 'ios'">
      <strong>{{ 'install_prompt.title' | translate }}</strong>
      <span>{{ 'install_prompt.ios_instructions' | translate }}</span>
    </ng-container>
  </div>

  <div class="banner-actions">
    <button mat-raised-button color="accent" *ngIf="installServ.mode === 'android'" (click)="install()">
      {{ 'install_prompt.install_button' | translate }}
    </button>
    <button mat-icon-button class="close-button" (click)="dismiss()" aria-label="Dismiss">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
