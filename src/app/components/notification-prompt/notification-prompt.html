<div class="notification-banner" *ngIf="visible">
  <ion-icon class="banner-icon" name="notifications-outline"></ion-icon>

  <div class="banner-text">
    <strong>{{ 'settings.notifications.title' | translate }}</strong>
    <span>{{ 'settings.notifications.description' | translate }}</span>
  </div>

  <div class="banner-actions">
    <ion-button color="light" size="small" [disabled]="busy" (click)="enable()">
      {{ 'settings.notifications.enable' | translate }}
    </ion-button>
    <ion-button fill="clear" class="close-button" (click)="dismiss()" aria-label="Dismiss">
      <ion-icon slot="icon-only" name="close"></ion-icon>
    </ion-button>
  </div>
</div>
