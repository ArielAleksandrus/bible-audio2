<div class="notification-banner" *ngIf="visible">
  <mat-icon class="banner-icon">notifications_active</mat-icon>

  <div class="banner-text">
    <strong>{{ 'settings.notifications.title' | translate }}</strong>
    <span>{{ 'settings.notifications.description' | translate }}</span>
  </div>

  <div class="banner-actions">
    <button mat-raised-button color="accent" [disabled]="busy" (click)="enable()">
      {{ 'settings.notifications.enable' | translate }}
    </button>
    <button mat-icon-button class="close-button" (click)="dismiss()" aria-label="Dismiss">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
