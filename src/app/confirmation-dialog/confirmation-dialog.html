<div class="hold-confirm-dialog ion-padding">
  <ion-button fill="clear" color="medium" class="close-button" (click)="onCancel()" aria-label="Fechar">
    <ion-icon slot="icon-only" name="close"></ion-icon>
  </ion-button>

  <h2 class="title-with-close">{{ title }}</h2>

  <p [innerHTML]="message"></p>

  <div class="button-container">
    <button type="button"
            class="hold-button"
            [class.holding]="progress > 0"
            (mousedown)="onMouseDown($event)"
            (touchstart)="onTouchStart($event)">
      <svg class="ring" viewBox="0 0 80 80" aria-hidden="true">
        <circle class="track" cx="40" cy="40" r="36"></circle>
        <circle class="bar" cx="40" cy="40" r="36"
                [attr.stroke-dasharray]="circumference"
                [attr.stroke-dashoffset]="circumference * (1 - progress / 100)"></circle>
      </svg>
      <span class="button-label">OK</span>
    </button>
  </div>
</div>
