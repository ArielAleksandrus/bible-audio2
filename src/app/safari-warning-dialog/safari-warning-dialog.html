<div class="safari-warning-dialog ion-padding">
  <ion-button fill="clear" color="medium" class="close-button" (click)="close()" aria-label="Fechar">
    <ion-icon slot="icon-only" name="close"></ion-icon>
  </ion-button>

  <h2 class="title-with-close">{{ 'safari_warning.title' | translate }}</h2>

  <p>{{ 'safari_warning.message' | translate }}</p>

  <div class="steps-illustration">
    <div class="step">
      <div class="step-icon">
        <ion-icon name="share-outline"></ion-icon>
      </div>
      <span class="step-label">{{ 'safari_warning.step_share' | translate }}</span>
    </div>

    <ion-icon class="step-arrow" name="arrow-forward"></ion-icon>

    <div class="step">
      <div class="step-icon highlight">
        <ion-icon name="add-circle-outline"></ion-icon>
      </div>
      <span class="step-label">{{ 'safari_warning.step_add' | translate }}</span>
    </div>
  </div>

  <div class="actions">
    <ion-button fill="outline" class="how-to-button" (click)="showExample()">{{ 'safari_warning.how_to' | translate }}</ion-button>
    <ion-button fill="clear" (click)="close()">{{ 'safari_warning.dismiss' | translate }}</ion-button>
  </div>
</div>
