<div class="video-example-dialog ion-padding">
  <ion-button fill="clear" color="medium" class="close-button" (click)="close()" aria-label="Fechar">
    <ion-icon slot="icon-only" name="close"></ion-icon>
  </ion-button>

  @if (!showVideo) {
    <div class="content">
      <p>{{ 'video_example.confirm_message' | translate }}</p>
    </div>
    <div class="actions">
      <ion-button fill="clear" (click)="close()">{{ 'video_example.no' | translate }}</ion-button>
      <ion-button (click)="confirm()">{{ 'video_example.yes' | translate }}</ion-button>
    </div>
  } @else {
    <div class="video-wrap">
      <iframe
        [src]="videoUrl"
        title="Example"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
  }
</div>
